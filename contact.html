<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Test Make</title>
</head>
<body>
  <h2>Formulaire test Make</h2>
  <form id="contactForm">
    <input type="text" id="nom" placeholder="Nom" required><br><br>
    <input type="text" id="entreprise" placeholder="Entreprise"><br><br>
    <textarea id="commentaire" placeholder="Votre message" required></textarea><br><br>
    <button type="submit">Envoyer</button>
  </form>

  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const data = new FormData();
      data.append("nom", document.getElementById('nom').value);
      data.append("entreprise", document.getElementById('entreprise').value);
      data.append("commentaire", document.getElementById('commentaire').value);

      fetch("https://hook.eu2.make.com/4wiyxnw2pzo3o3uos2ivv1lf4z1re2yx", {
        method: "POST",
        body: data
      })
      .then(() => alert("✅ Envoyé à Make !"))
      .catch(err => console.error("Erreur :", err));
    });
  </script>
</body>
</html>
